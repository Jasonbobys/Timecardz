<style>
:root{
  --bg:#E4E8E1; --card:#F7F8F4; --ink:#1C2433; --muted:#5C6470; --line:#CDD3C8;
  --in:#2F6B4F; --out:#A8322A; --today:#FFF1B0; --on:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141920; --card:#1D242D; --ink:#E8ECE6; --muted:#98A1AC; --line:#2E3742;
    --in:#4C9F78; --out:#DD6157; --today:#3A3518; --on:#0f1318;
  }
}
:root[data-theme="dark"]{
  --bg:#141920; --card:#1D242D; --ink:#E8ECE6; --muted:#98A1AC; --line:#2E3742;
  --in:#4C9F78; --out:#DD6157; --today:#3A3518; --on:#0f1318;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.now{padding:8px 4px 18px}
.date{font-size:1rem;color:var(--muted);margin:0}
.clock{
  margin:2px 0 0; font-weight:800; font-stretch:118%;
  font-size:clamp(3rem,16vw,4.6rem); line-height:1; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.clock small{font-size:.32em;font-weight:600;letter-spacing:0;margin-left:.25em;color:var(--muted)}
.punch{
  display:block;width:100%;border:0;border-radius:22px;padding:22px 20px;
  font:inherit;color:var(--on);background:var(--in);cursor:pointer;text-align:left;
  transition:transform .08s ease, filter .15s ease;
  box-shadow:0 4px 0 color-mix(in srgb, var(--in) 60%, #000);
}
.punch.out{background:var(--out);box-shadow:0 4px 0 color-mix(in srgb, var(--out) 60%, #000)}
.punch:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.punch:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.punch .big{display:block;font-size:1.9rem;font-weight:800;font-stretch:112%;line-height:1.1}
.punch .sub{display:block;font-size:.95rem;opacity:.85;margin-top:4px}
.status{margin:14px 4px 26px;color:var(--muted);font-size:.98rem;min-height:1.4em}
.status b{color:var(--ink)}
.week{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.week h2{
  margin:0;padding:12px 14px;font-size:1rem;font-weight:700;
  display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)
}
.week h2 span{font-weight:500;color:var(--muted);font-size:.9rem}
.row{
  display:grid;grid-template-columns:1.15fr 1fr 1fr .85fr;align-items:center;
  padding:4px 8px 4px 14px;border-bottom:1px solid var(--line);min-height:52px;
}
.row:last-child{border-bottom:0}
.row.head{min-height:0;padding-top:8px;padding-bottom:6px;font-size:.8rem;color:var(--muted)}
.row.today{background:var(--today)}
.day{font-weight:700}
.day small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.t{
  font:inherit;font-variant-numeric:tabular-nums;background:none;border:0;color:var(--ink);
  text-align:left;padding:10px 4px;border-radius:8px;cursor:pointer;font-size:.95rem
}
.t:hover,.t:focus-visible{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.t.empty{color:var(--muted)}
.hrs{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-right:6px}
.total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:16px 4px;border-top:2px solid var(--ink);margin-top:6px;
}
.total strong{font-size:1.6rem;font-stretch:112%;font-variant-numeric:tabular-nums}
.reset{
  display:block;width:100%;margin-top:18px;padding:16px;border-radius:14px;
  background:none;border:2px solid var(--out);color:var(--out);font:inherit;font-weight:700;cursor:pointer;
}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:14px 0 0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* inline editor + reset confirm */
.editor{padding:14px;border-bottom:1px solid var(--line);background:var(--bg)}
.editor label{display:block;font-weight:700;margin-bottom:8px}
.editor input[type=time]{
  width:100%;font:inherit;font-size:1.5rem;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:12px
}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:14px;border-radius:12px;font:inherit;font-weight:700;border:0;cursor:pointer}
.btn-plain{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
.btn-go{background:var(--ink);color:var(--card)}
.btn-danger{background:var(--out);color:#fff}
.btn-clear{background:none;color:var(--out);border:2px solid var(--out)!important}
.confirm{margin-top:18px;padding:16px;border-radius:14px;border:2px solid var(--out);background:var(--card)}
.confirm p{margin:0 0 12px}
.warn{color:var(--out);font-weight:600;font-size:.85rem}
@media (prefers-reduced-motion: reduce){.punch{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="now">
    <p class="date" id="date"></p>
    <p class="clock" id="clock"></p>
  </section>

  <button class="punch" id="punch" type="button">
    <span class="big" id="punchBig">Loading…</span>
    <span class="sub" id="punchSub">Getting your saved times</span>
  </button>
  <p class="status" id="status" aria-live="polite"></p>

  <div id="weeks"></div>

  <div class="total">
    <span>2-week total</span>
    <strong id="grand">0h 00m</strong>
  </div>

  <div id="resetArea"></div>
  <p class="hint">Tap any time to fix it. <span id="sync">Saved on this phone.</span></p>
</main>

<script>
(function(){
  const LS_KEY = 'timeclock-v1';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const pad = n => String(n).padStart(2,'0');
  const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
  const fmtShort = d => (d.getMonth()+1)+'/'+d.getDate();
  const fmtMonthDay = d => d.toLocaleDateString([], {month:'short', day:'numeric'});
  const fmtDur = ms => { const m = Math.max(0, Math.round(ms/60000)); return Math.floor(m/60)+'h '+pad(m%60)+'m'; };
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const $ = id => document.getElementById(id);

  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dow = x.getDay();
    x.setDate(x.getDate() + (dow === 0 ? -6 : 1 - dow));
    return x;
  }
  function upcomingMonday(d){
    const base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const dow = d.getDay();
    if (dow === 6) return addDays(base, 2);
    if (dow === 0) return addDays(base, 1);
    return mondayOf(d);
  }

  function blank(){ return { start:null, days:{}, updatedAt:0 }; }
  function normalize(s){
    if (!s || typeof s !== 'object') return blank();
    return { start: typeof s.start === 'string' ? s.start : null,
             days: (s.days && typeof s.days === 'object') ? JSON.parse(JSON.stringify(s.days)) : {},
             updatedAt: Number(s.updatedAt) || 0 };
  }

  let editing = null;          // { k, which, value }
  let confirmingReset = false;
  let lastKey = '';
  let state = blank();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch(e){}

  // ---------- saving: phone first, account in the background ----------
  // Stamping never waits on the internet. The phone copy saves instantly;
  // the account copy catches up on its own.
  let docRef = null, pushing = false, pushAgain = false;
  const syncEl = $('sync');
  function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
  async function pushRemote(){
    if (!docRef) return;
    if (pushing) { pushAgain = true; return; }
    pushing = true;
    try {
      await withTimeout(docRef.set({ start: state.start, days: state.days, updatedAt: state.updatedAt }), 8000);
      syncEl.textContent = 'Saved to your account.';
    } catch(e) {
      syncEl.textContent = 'Saved on this phone.';
    }
    pushing = false;
    if (pushAgain) { pushAgain = false; pushRemote(); }
  }
  function save(){ state.updatedAt = Date.now(); saveLocal(); pushRemote(); }

  async function pullRemote(){
    if (!docRef) return false;
    const snap = await withTimeout(docRef.get(), 4000);
    if (snap.exists) {
      const remote = normalize(snap.data());
      if (remote.updatedAt > state.updatedAt) { state = remote; saveLocal(); return true; }
      if (state.updatedAt > remote.updatedAt) pushRemote();
    } else if (state.updatedAt) {
      pushRemote();
    }
    return false;
  }

  let ready = false;
  function markReady(){ if (!ready) { ready = true; render(); } }
  setTimeout(markReady, 4000);

  (async function connect(){
    try {
      if (!window.claude || !window.claude.use) return markReady();
      const [db, user] = await withTimeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 4000);
      if (!db || !user) return markReady();
      const id = await withTimeout(user.id(), 3000);
      if (!id) return markReady();
      docRef = db.doc('data/users/' + id + '/timecard');
      await pullRemote();
      syncEl.textContent = 'Saved to your account.';
    } catch(e) {}
    markReady();
    render();
  })();

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    try { if (await pullRemote()) render(); } catch(e){}
    tick();
  });

  // ---------- period ----------
  function periodStart(now){ return state.start ? parseKey(state.start) : upcomingMonday(now); }
  function periodDays(now){
    const s = periodStart(now), out = [];
    for (let w = 0; w < 2; w++) for (let i = 0; i < 5; i++) out.push(addDays(s, w*7+i));
    return out;
  }
  function todayStatus(now){
    const dow = now.getDay();
    if (dow === 0 || dow === 6) return 'weekend';
    if (state.start){
      const end = addDays(parseKey(state.start), 11);
      end.setHours(23,59,59,999);
      if (now > end) return 'full';
    }
    return 'ok';
  }

  // ---------- screen ----------

  function tick(){
    const now = new Date();
    $('date').textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    const t = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit', hour12:true});
    const parts = t.split(/\s+/);
    const c = $('clock');
    c.textContent = parts[0];
    if (parts[1]) { const s = document.createElement('small'); s.textContent = parts[1]; c.append(s); }
    const k = keyOf(now);
    if (k !== lastKey) { lastKey = k; render(); } else renderButton(now);
  }

  function renderButton(now){
    const btn = $('punch'), big = $('punchBig'), sub = $('punchSub'), st = $('status');
    btn.classList.remove('out');
    btn.disabled = false;
    if (!ready) {
      btn.disabled = true; big.textContent = 'Loading…'; sub.textContent = 'Getting your saved times';
      st.textContent = ''; return;
    }
    const status = todayStatus(now);
    const rec = state.days[keyOf(now)] || {};
    st.textContent = '';
    if (status === 'weekend') {
      btn.disabled = true; big.textContent = 'Weekend'; sub.textContent = 'Clocking works Monday to Friday';
    } else if (status === 'full') {
      btn.disabled = true; big.textContent = 'Timecard full'; sub.textContent = 'Press Reset to start a new 2 weeks';
      st.textContent = 'Your 2 weeks are done.';
    } else if (!rec.in) {
      big.textContent = 'Clock in'; sub.textContent = 'Stamps ' + fmtTime(now) + ' for today';
      st.textContent = 'Not clocked in yet today.';
    } else if (!rec.out) {
      btn.classList.add('out');
      big.textContent = 'Clock out'; sub.textContent = 'Stamps ' + fmtTime(now) + ' for today';
      st.append('On the clock since ');
      const b = document.createElement('b'); b.textContent = fmtTime(rec.in); st.append(b);
      st.append(' (' + fmtDur(now - new Date(rec.in)) + ' so far)');
    } else {
      btn.disabled = true; big.textContent = 'Done for today'; sub.textContent = 'Tap a time below to fix it';
      st.append('You worked ');
      const b = document.createElement('b'); b.textContent = fmtDur(new Date(rec.out) - new Date(rec.in)); st.append(b);
      st.append(' today.');
    }
  }

  function mk(label, cls, fn){
    const b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label;
    b.addEventListener('click', fn); return b;
  }

  function render(){
    const now = new Date();
    const days = periodDays(now);
    const todayK = keyOf(now);
    const wrap = $('weeks');
    wrap.innerHTML = '';
    let grand = 0;
    for (let w = 0; w < 2; w++){
      const slice = days.slice(w*5, w*5+5);
      let weekMs = 0;
      const sec = document.createElement('section'); sec.className = 'week';
      const h = document.createElement('h2'); h.textContent = 'Week ' + (w+1);
      const range = document.createElement('span'); h.append(range); sec.append(h);
      const head = document.createElement('div'); head.className = 'row head';
      ['Day','In','Out','Hours'].forEach((txt,i) => { const c = document.createElement('div'); c.textContent = txt; if (i===3) c.style.textAlign='right'; head.append(c); });
      sec.append(head);

      slice.forEach(d => {
        const k = keyOf(d), rec = state.days[k] || {};
        const row = document.createElement('div');
        row.className = 'row' + (k === todayK ? ' today' : '');
        const day = document.createElement('div'); day.className = 'day'; day.textContent = DAYS[d.getDay()];
        const sm = document.createElement('small'); sm.textContent = fmtShort(d); day.append(sm);
        row.append(day, timeBtn(k, 'in', rec.in, d), timeBtn(k, 'out', rec.out, d));
        const hrs = document.createElement('div'); hrs.className = 'hrs';
        if (rec.in && rec.out){
          const ms = new Date(rec.out) - new Date(rec.in);
          if (ms < 0) { hrs.className = 'hrs warn'; hrs.textContent = 'Check'; }
          else { weekMs += ms; hrs.textContent = fmtDur(ms); }
        }
        row.append(hrs);
        sec.append(row);
        if (editing && editing.k === k) sec.append(editorFor(k, d, rec));
      });
      range.textContent = fmtMonthDay(slice[0]) + ' to ' + fmtMonthDay(slice[4]) + ', ' + fmtDur(weekMs);
      grand += weekMs;
      wrap.append(sec);
    }
    $('grand').textContent = fmtDur(grand);
    renderReset();
    renderButton(now);
  }

  function timeBtn(k, which, iso, d){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 't' + (iso ? '' : ' empty');
    b.textContent = iso ? fmtTime(iso) : '—';
    b.setAttribute('aria-label', (which === 'in' ? 'Clock-in time for ' : 'Clock-out time for ') + d.toDateString());
    b.addEventListener('click', () => {
      const base = iso ? new Date(iso) : new Date();
      editing = { k, which, value: pad(base.getHours()) + ':' + pad(base.getMinutes()) };
      render();
      const inp = document.getElementById('editTime');
      if (inp && inp.scrollIntoView) { try { inp.scrollIntoView({block:'center', behavior:'smooth'}); } catch(e){} }
    });
    return b;
  }

  function editorFor(k, d, rec){
    const box = document.createElement('div'); box.className = 'editor';
    const which = editing.which;
    const lab = document.createElement('label'); lab.htmlFor = 'editTime';
    lab.textContent = (which === 'in' ? 'Clock-in' : 'Clock-out') + ' time for ' + DAYS[d.getDay()] + ' ' + fmtShort(d);
    const input = document.createElement('input');
    input.type = 'time'; input.id = 'editTime'; input.value = editing.value;
    input.addEventListener('input', () => { editing.value = input.value; });
    input.addEventListener('change', () => { editing.value = input.value; });
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.append(mk('Cancel', 'btn-plain', () => { editing = null; render(); }));
    if (rec[which]) actions.append(mk('Clear', 'btn-clear', () => {
      const r = state.days[k] || {};
      delete r[which];
      if (!r.in && !r.out) delete state.days[k]; else state.days[k] = r;
      editing = null; save(); render();
    }));
    actions.append(mk('Save', 'btn-go', () => {
      const v = input.value || editing.value;
      if (!v) return;
      const [hh, mm] = v.split(':').map(Number);
      const dt = parseKey(k); dt.setHours(hh, mm, 0, 0);
      if (!state.start) state.start = keyOf(mondayOf(parseKey(k)));
      const r = state.days[k] || {};
      r[which] = dt.toISOString();
      state.days[k] = r;
      editing = null; save(); render();
    }));
    box.append(lab, input, actions);
    return box;
  }

  function renderReset(){
    const area = $('resetArea');
    area.innerHTML = '';
    if (!confirmingReset) {
      area.append(mk('Reset timecard', 'reset', () => { confirmingReset = true; renderReset(); }));
      return;
    }
    const box = document.createElement('div'); box.className = 'confirm';
    const p = document.createElement('p'); p.textContent = 'Clear every time on the card? Your next clock-in starts a new 2 weeks.';
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.append(
      mk('Cancel', 'btn-plain', () => { confirmingReset = false; renderReset(); }),
      mk('Yes, reset', 'btn-danger', () => { state = blank(); editing = null; confirmingReset = false; save(); render(); })
    );
    box.append(p, actions);
    area.append(box);
  }

  // ---------- the button ----------
  $('punch').addEventListener('click', () => {
    if (!ready) return;
    const now = new Date();
    if (todayStatus(now) !== 'ok') return;
    const k = keyOf(now);
    const rec = state.days[k] || {};
    if (!rec.in) rec.in = now.toISOString();       // clock in
    else if (!rec.out) rec.out = now.toISOString(); // clock out (never overwrites a clock-in)
    else return;
    if (!state.start) state.start = keyOf(mondayOf(now));
    state.days[k] = rec;
    save();
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch(e){} }
    render();
  });

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
